# See:
# - https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal/gitlab-ci
# - https://project.pages.drupalcode.org/gitlab_templates/
# - https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _SHOW_ENVIRONMENT_VARIABLES: 1
  _TARGET_PHP: "$CORE_PHP_MIN"
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1

composer (D9):
  extends: .composer-base
  variables:
    PHP_VERSION: "8.2"
    PHP_IMAGE_VARIANT: "apache"
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 1
    DRUPAL_CORE: "9.5.11"

phpunit (D9):
  extends: phpunit
  needs: [composer (D9)]

phpstan:
  allow_failure: false
phpcs:
  allow_failure: false
eslint:
  allow_failure: false
cspell:
  allow_failure: false
