# Schema for the configurations of the styleswitcher module.

styleswitcher.custom_styles:
  type: config_object
  label: 'Custom styles'
  mapping:
    styles:
      type: sequence
      label: 'Styles'
      sequence:
        type: mapping
        label: 'Style'
        mapping:
          name:
            type: string
            label: 'Machine name'
          label:
            type: string
            label: 'Title'
          path:
            type: string
            label: 'Path'

styleswitcher.styles_settings:
  type: config_object
  label: 'Styles settings'
  mapping:
    settings:
      type: sequence
      label: 'Theme settings'
      sequence:
        type: sequence
        label: 'Styles'
        sequence:
          type: mapping
          label: 'Style'
          mapping:
            weight:
              type: integer
              label: 'Weight'
            status:
              type: boolean
              label: 'Enabled'
            is_default:
              type: boolean
              label: 'Default'

styleswitcher.settings:
  type: config_object
  label: 'Style Switcher settings'
  mapping:
    enable_overlay:
      type: boolean
      label: 'Enable overlay'
    7206_theme_default:
      type: string
